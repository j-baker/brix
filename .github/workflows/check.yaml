name: Run checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    name: Nix checks
    runs-on: trustless-amd64-large
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/checkout@v4
      - uses: j-baker/build-action@v0.4.0
        with:
          ssh-host: dev.trustless.build
          org-slug: local-test
          # versioned-packages: brix
          # Builds and tests brix, and runs the source checks of
          # nix/checks.nix: formatting, Clippy, the wasm-clean crates, and
          # that Cargo.nix is what crate2nix makes of Cargo.lock.
          command: nix flake check -L
